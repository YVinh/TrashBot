  let LANG = "en", T = I18N.en, feedData = null;
  function pickInitialLang() {
    try { const saved = localStorage.getItem("lang"); if (I18N[saved]) return saved; } catch (e) {}
    const nav = (navigator.language || "").slice(0, 2).toLowerCase();
    return I18N[nav] ? nav : "en";
  }
  function setLang(code, persist) {
    LANG = code; T = I18N[code];
    document.documentElement.lang = code;
    if (persist) { try { localStorage.setItem("lang", code); } catch (e) {} }
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === code)));
    document.getElementById("label").innerHTML = T.caption;
    document.getElementById("view-about").innerHTML = T.about;
    document.getElementById("nav-feed").textContent = T.nav.feed;
    document.getElementById("nav-about").textContent = T.nav.about;
    document.getElementById("drawer-foot").textContent = T.drawerFoot;
    fmtShort = new Intl.DateTimeFormat(T.locale, { timeZone: TZ, day: "numeric", month: "short" });
    fmtYear = new Intl.DateTimeFormat(T.locale, { timeZone: TZ, day: "numeric", month: "short", year: "numeric" });
    fmtFull = new Intl.DateTimeFormat(T.locale, { timeZone: TZ, dateStyle: "long", timeStyle: "short" });
    if (feedData) render(feedData);
    route();
  }
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang, true)));

  /* ---------- routing + drawer ---------- */
  const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim"), menuBtn = document.getElementById("menu-btn");
  function openMenu() { drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false"); scrim.hidden = false; menuBtn.setAttribute("aria-expanded", "true"); }
  function closeMenu() { drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); scrim.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); }
  menuBtn.addEventListener("click", openMenu);
  document.getElementById("close-btn").addEventListener("click", closeMenu);
  scrim.addEventListener("click", closeMenu);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

  function route() {
    const about = location.hash.replace(/^#\/?/, "") === "about";
    document.getElementById("view-feed").hidden = about;
    document.getElementById("view-about").hidden = !about;
    document.getElementById("label").hidden = about;
    document.title = about ? T.aboutTitle : "Trashbot Village";
    document.querySelectorAll("[data-route]").forEach(a => {
      if (a.dataset.route === (about ? "about" : "feed")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    closeMenu();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function richText(text) {
    return esc(text)
      .replace(/(^|\s)#([\p{L}\p{N}_]+)/gu, (m, sp, t) => `${sp}<a href="https://x.com/hashtag/${encodeURIComponent(t)}" rel="noopener nofollow" target="_blank">#${t}</a>`)
      .replace(/(^|\s)@([\w]+)/g, (m, sp, h) => `${sp}<a href="https://x.com/${h}" rel="noopener nofollow" target="_blank">@${h}</a>`);

  function when(d) {
    const diff = (Date.now() - d) / 1000;
    if (diff < 60) return T.now;

  /* ---------- rendering ---------- */
  function renderTweet(p, byId, isLast) {
    const isPublic = p.author === "public";
    const a = isPublic
      ? { name: T.visitor + (p.visitor || "????"), handle: T.anon, cls: "public", initial: "?" }
      : AUTHORS[p.author];
    const d = new Date(p.at);
    const parent = p.reply_to && byId[p.reply_to];
    const parentHandle = parent ? (parent.author === "public" ? T.anon : AUTHORS[parent.author].handle) : null;
    const m = p.metrics || {};
    const head = `<span class="name">${esc(a.name)}</span><span class="handle">@${esc(a.handle)}</span><span class="dot">·</span>` +
      (p.url ? `<a href="${esc(p.url)}" rel="noopener nofollow" target="_blank"><time datetime="${esc(p.at)}" title="${fmtFull.format(d)}">${when(d)}</time></a>`
             : `<time datetime="${esc(p.at)}" title="${fmtFull.format(d)}">${when(d)}</time>`);
    // X hides a trailing link when it renders it as a card; do the same.
    let text = p.text;
    if (p.source_url && text.trimEnd().endsWith(p.source_url)) text = text.slice(0, text.lastIndexOf(p.source_url)).trimEnd();
    const replying = parentHandle ? `<p class="replying">${T.replying} <a href="https://x.com/${esc(parentHandle)}" rel="noopener nofollow" target="_blank">@${esc(parentHandle)}</a></p>` : "";
    const media = p.image ? `<div class="media"><img src="${esc(p.image)}" alt="" loading="lazy"></div>` : "";
    const card = p.source_url ? (() => {
      let domain = p.source_url; try { domain = new URL(p.source_url).hostname.replace(/^www\./, ""); } catch (e) {}
      return `<a class="card" href="${esc(p.source_url)}" rel="noopener nofollow" target="_blank">
        <div class="card__img"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M18.36 5.64c-1.95-1.96-5.11-1.96-7.07 0L9.88 7.05 8.46 5.64l1.42-1.42c2.73-2.73 7.16-2.73 9.9 0 2.73 2.74 2.73 7.17 0 9.9l-1.42 1.42-1.41-1.42 1.41-1.41c1.96-1.96 1.96-5.12 0-7.07zm-2.12 3.53l-7.07 7.07-1.41-1.41 7.07-7.07 1.41 1.41zm-12.02.71l1.42-1.42 1.41 1.42-1.41 1.41c-1.96 1.96-1.96 5.12 0 7.07 1.95 1.96 5.11 1.96 7.07 0l1.41-1.41 1.42 1.41-1.42 1.42c-2.73 2.73-7.16 2.73-9.9 0-2.73-2.74-2.73-7.17 0-9.9z"/></svg></div>
        <div class="card__body"><div class="card__domain">${esc(domain)}</div><div class="card__title">${esc(p.source_url.replace(/^https?:\/\/[^/]+\/?/, "").replace(/[-_/]+/g, " ").trim() || domain)}</div></div>
      </a>`; })() : "";
    const replyCount = m.replies !== undefined ? m.replies : Object.values(byId).filter(x => x.reply_to === p.id).length;
    const actions = isPublic ? "" : `<div class="actions" aria-label="Engagement">
        <span class="reply">${ICONS.reply}${n(replyCount) || ""}</span>
        <span class="repost">${ICONS.repost}${n(m.reposts)}</span>
        <span class="like">${ICONS.like}${n(m.likes)}</span>
        <span class="views">${ICONS.views}${n(m.impressions)}</span>
        ${p.url ? `<a class="open-x" href="${esc(p.url)}" rel="noopener nofollow" target="_blank" title="${T.openX}" aria-label="${T.openX}">${ICONS.x}</a>` : ""}
      </div>`;
    return `<article class="tweet"${p.url ? ` data-url="${esc(p.url)}"` : ""}>
      <div class="tweet__left">${avatar(a.cls, a.initial)}${isLast ? "" : '<div class="threadline"></div>'}</div>
      <div class="tweet__body">
        <div class="tweet__head">${head}</div>
        ${replying}
        <p class="tweet__text">${richText(text)}</p>
        ${media}${card}${actions}
      </div>
    </article>`;
  }

  function renderThread(ep) {
    const posts = ep.posts.slice().sort((a, b) => new Date(a.at) - new Date(b.at));
    const byId = Object.fromEntries(posts.map(p => [p.id, p]));
    return `<section class="thread" id="t-${esc(ep.id)}">${posts.map((p, i) => renderTweet(p, byId, i === posts.length - 1)).join("")}</section>`;
  }

  function render(feed) {
    const el = document.getElementById("feed"), note = document.getElementById("feed-note");
    const obs = (feed.observations || []).slice().sort((a, b) => new Date(b.started_at) - new Date(a.started_at));
    if (!obs.length) { el.innerHTML = `<p class="feed-empty">${T.empty}</p>`; return; }
    el.innerHTML = obs.map(renderThread).join("");
    note.hidden = !feed.sample; if (feed.sample) note.textContent = T.sample;
  }

  setLang(pickInitialLang(), false);
  const show = feed => { feedData = feed; render(feed); };
  document.getElementById("feed").addEventListener("click", e => {
    const card = e.target.closest(".tweet[data-url]");
    if (!card || e.target.closest("a") || String(window.getSelection())) return;
    window.open(card.dataset.url, "_blank", "noopener");
  });

  const fallback = () => JSON.parse(document.getElementById("feed-fallback").textContent);
  fetch("feed.json", { cache: "no-cache" })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(show)
    .catch(() => { try { show(fallback()); } catch (e) { show({ observations: [] }); } });
})();
